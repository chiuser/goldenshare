<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 945" role="img" aria-labelledby="title caption">
<title id="title">技术指标算子库 UML 主类图</title>
<desc id="caption">库入口分别调用独立解析器、数据读取和输入检查、算子引擎及输出收集器。读取接口由本地 DG 或 Prod PostgreSQL 实现，只使用启动时指定的一方。</desc>
<style>
  svg {font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  text {fill:#172f4b}
  .title {font-size:31px;font-weight:730}
  .subtitle,.fine {fill:#4a6179;font-size:15px}
  .section {font-size:16px;font-weight:700}
  .class-head {font-size:16px;font-weight:650}
  .long-head {font-size:13.5px}
  .class-code {font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .class-desc {font-size:14px;fill:#4a6179}
  .caption {font-size:14px;fill:#485e77}
  .chiptext {font-size:13px;font-weight:700}
  .tag {fill:#3e5773;font-size:12px;font-weight:700}
  .bg {fill:#f4f7fb;stroke:#d4e0ed}
  .top {fill:#e9f1fb;stroke:#bccfe4}
  .zone {fill:#f8fafc;stroke:#cbd8e6}
  .zonehead {fill:#eaf0f7}
  .uml {fill:#fff;stroke:#9cb2ca;stroke-width:1.3}
  .new {fill:#eaf8f3;stroke:#58a790;stroke-width:1.4}
  .entry {fill:#fff;stroke:#386cb4;stroke-width:1.8}
  .rule {stroke:#b4c6d9;stroke-width:1}
  .edge,.returns,.implements,.critical {fill:none;stroke:#456383;stroke-width:1.65}
  .returns,.implements {stroke-dasharray:6 4}
  .critical {stroke:#9f362f;stroke-width:1.9}
  .lifeline {stroke:#a8bbcf;stroke-width:1.25;stroke-dasharray:4 5}
  .calltext,.returntext,.errtext {paint-order:stroke;stroke:#fcfdff;stroke-width:8px;stroke-linejoin:round;font-size:15px}
  .returntext {fill:#4a6179}
  .errtext {fill:#90372e;font-weight:650}
  .alt-frame {fill:none;stroke:#819ab6;stroke-width:1.3}
  .alt-failure {fill:#fff3f0}
  .alt-ok {fill:#edf7f2}
  .note {fill:#fff8e9;stroke:#dfc792}
</style>
<defs>
  <marker id="arrow" orient="auto" markerUnits="userSpaceOnUse" refX="8.7" refY="5" markerWidth="12" markerHeight="10"><path d="M1 1L8 5 1 9" fill="none" stroke="#456383" stroke-width="1.55" stroke-linecap="round"/></marker>
  <marker id="error-arrow" orient="auto" markerUnits="userSpaceOnUse" refX="8.7" refY="5" markerWidth="12" markerHeight="10"><path d="M1 1L8 5 1 9" fill="none" stroke="#9f362f" stroke-width="1.7" stroke-linecap="round"/></marker>
  <marker id="triangle" orient="auto" markerUnits="userSpaceOnUse" refX="12.1" refY="6" markerWidth="13" markerHeight="12"><path d="M1 1L12 6 1 11Z" fill="#fff" stroke="#456383" stroke-width="1.45"/></marker>
</defs>
<rect x="1" y="1" width="1358" height="943" rx="16" class="bg"/>
<text x="28" y="49" class="title" text-anchor="start">技术指标算子库 · UML 主类图</text>
<text x="29" y="76" class="subtitle" text-anchor="start">四个模块各司其职；库入口协调执行，配置在启动时固定来源。</text>
<rect x="1121" y="56" width="91" height="25" rx="12" class="new"/>
<text x="1166" y="73" class="chiptext" text-anchor="middle">目标新增</text>
<rect x="1222" y="56" width="105" height="25" rx="12" class="uml"/>
<text x="1274" y="73" class="chiptext" text-anchor="middle">现有或复用</text>
<rect x="24" y="101" width="1312" height="172" rx="11" class="top"/>
<text x="42" y="127" class="section" text-anchor="start">库的统一入口与共享配置</text>
<rect x="45" y="160" width="212" height="74" rx="7" class="uml"/>
<text x="151" y="186" class="class-head" text-anchor="middle">上游业务</text>
<line x1="45" y1="196" x2="257" y2="196" class="rule"/>
<text x="56" y="217" class="class-desc" text-anchor="start">只传计算指令</text>
<rect x="467" y="143" width="426" height="112" rx="7" class="entry"/>
<text x="680" y="169" class="class-head" text-anchor="middle">TechnicalIndicatorService</text>
<line x1="467" y1="179" x2="893" y2="179" class="rule"/>
<text x="478" y="200" class="class-code" text-anchor="start">+ calculate(request) → CalculationResult</text>
<text x="478" y="219" class="class-desc" text-anchor="start">负责协调与清理，不解析、不实现指标</text>
<rect x="1005" y="143" width="304" height="112" rx="7" class="uml"/>
<text x="1157" y="169" class="class-head" text-anchor="middle">KernelConfig</text>
<line x1="1005" y1="179" x2="1309" y2="179" class="rule"/>
<text x="1016" y="200" class="class-code" text-anchor="start">- data_location</text>
<text x="1016" y="219" class="class-code" text-anchor="start">- dataset_locations</text>
<text x="1016" y="238" class="class-desc" text-anchor="start">本地：DG；生产：PG，不切换</text>
<path d="M257 197 H467" class="edge" marker-end="url(#arrow)"/>
<text x="356" y="189" class="class-code" text-anchor="middle">CalculationRequest</text>
<path d="M893 198 H1005" class="edge" marker-end="url(#arrow)"/>
<text x="949" y="188" class="caption" text-anchor="middle">共享配置</text>
<path d="M680 255 V300 H182 M680 300 H1178" class="edge"/>
<path d="M182 300 V369" class="edge" marker-end="url(#arrow)"/>
<path d="M514 300 V369" class="edge" marker-end="url(#arrow)"/>
<path d="M846 300 V369" class="edge" marker-end="url(#arrow)"/>
<path d="M1178 300 V369" class="edge" marker-end="url(#arrow)"/>
<rect x="24" y="326" width="316" height="571" rx="10" class="zone"/>
<rect x="25" y="327" width="314" height="32" rx="9" class="zonehead"/>
<text x="37" y="350" class="section" text-anchor="start">01   指令解析</text>
<rect x="356" y="326" width="316" height="571" rx="10" class="zone"/>
<rect x="357" y="327" width="314" height="32" rx="9" class="zonehead"/>
<text x="369" y="350" class="section" text-anchor="start">02   行情读取与输入检查</text>
<rect x="688" y="326" width="316" height="571" rx="10" class="zone"/>
<rect x="689" y="327" width="314" height="32" rx="9" class="zonehead"/>
<text x="701" y="350" class="section" text-anchor="start">03   算子计算</text>
<rect x="1020" y="326" width="316" height="571" rx="10" class="zone"/>
<rect x="1021" y="327" width="314" height="32" rx="9" class="zonehead"/>
<text x="1033" y="350" class="section" text-anchor="start">04   输出检查</text>
<path d="M182 359 V373" class="edge" marker-end="url(#arrow)"/>
<path d="M514 359 V373" class="edge" marker-end="url(#arrow)"/>
<path d="M846 359 V373" class="edge" marker-end="url(#arrow)"/>
<path d="M1178 359 V373" class="edge" marker-end="url(#arrow)"/>
<rect x="40" y="373" width="284" height="115" rx="7" class="new"/>
<text x="182" y="399" class="class-head" text-anchor="middle">CalculationRequestParser</text>
<line x1="40" y1="409" x2="324" y2="409" class="rule"/>
<text x="51" y="430" class="class-code" text-anchor="start">- config, registry</text>
<text x="51" y="449" class="class-code" text-anchor="start">+ parse(request)</text>
<text x="51" y="468" class="class-desc" text-anchor="start">只解析指令，不访问行情</text>
<path d="M182 488 V554" class="edge" marker-end="url(#arrow)"/>
<text x="192" y="523" class="caption" text-anchor="start">返回解析结果</text>
<rect x="40" y="554" width="284" height="98" rx="7" class="uml"/>
<text x="182" y="580" class="class-head" text-anchor="middle">_PreparedCalculation</text>
<line x1="40" y1="590" x2="324" y2="590" class="rule"/>
<text x="51" y="611" class="class-desc" text-anchor="start">request · plan · target</text>
<text x="51" y="630" class="class-desc" text-anchor="start">不持有文件或数据库连接</text>
<path d="M182 652 V711" class="returns" marker-end="url(#arrow)"/>
<text x="192" y="685" class="caption" text-anchor="start">保留原指令</text>
<rect x="40" y="711" width="284" height="78" rx="7" class="uml"/>
<text x="182" y="737" class="class-head" text-anchor="middle">CalculationRequest</text>
<line x1="40" y1="747" x2="324" y2="747" class="rule"/>
<text x="51" y="768" class="class-desc" text-anchor="start">品种、代码、周期、区间、算子</text>
<text x="53" y="864" class="fine" text-anchor="start">解析器通过配置拿到 DatasetReadTarget。</text>
<rect x="372" y="373" width="284" height="115" rx="7" class="uml"/>
<text x="514" y="399" class="class-head" text-anchor="middle">PriceInputSession</text>
<line x1="372" y1="409" x2="656" y2="409" class="rule"/>
<text x="383" y="430" class="class-code" text-anchor="start">+ prepare()</text>
<text x="383" y="449" class="class-code" text-anchor="start">+ next_batch() → PriceBatch</text>
<text x="383" y="468" class="class-desc" text-anchor="start">检查已读行情；分钟位置不查缺口</text>
<path d="M514 488 V544" class="edge" marker-end="url(#arrow)"/>
<text x="522" y="524" class="caption" text-anchor="start">使用</text>
<rect x="372" y="544" width="284" height="100" rx="7" class="uml"/>
<text x="514" y="561" class="tag" text-anchor="middle">«interface»</text>
<text x="514" y="581" class="class-head" text-anchor="middle">PriceSource</text>
<line x1="372" y1="591" x2="656" y2="591" class="rule"/>
<text x="383" y="612" class="class-code" text-anchor="start">+ create_locator() · open()</text>
<text x="383" y="631" class="class-code" text-anchor="start">+ expected_positions()¹</text>
<rect x="372" y="704" width="284" height="69" rx="7" class="uml"/>
<text x="514" y="730" class="class-head long-head" text-anchor="middle">LakeTechnicalIndicatorPriceSource</text>
<line x1="372" y1="740" x2="656" y2="740" class="rule"/>
<text x="383" y="761" class="class-desc" text-anchor="start">本地只读正式 DG 文件</text>
<rect x="372" y="795" width="284" height="69" rx="7" class="new"/>
<text x="514" y="821" class="class-head long-head" text-anchor="middle">PostgresTechnicalIndicatorPriceSource</text>
<line x1="372" y1="831" x2="656" y2="831" class="rule"/>
<text x="383" y="852" class="class-desc" text-anchor="start">生产只读指定 PG 对象</text>
<path d="M372 738 H364 V596 H372" class="implements" marker-end="url(#triangle)"/>
<path d="M656 830 H666 V596 H656" class="implements" marker-end="url(#triangle)"/>
<rect x="704" y="373" width="284" height="115" rx="7" class="uml"/>
<text x="846" y="399" class="class-head" text-anchor="middle">CalculationEngine</text>
<line x1="704" y1="409" x2="988" y2="409" class="rule"/>
<text x="715" y="430" class="class-code" text-anchor="start">+ resolve_history_requirement()</text>
<text x="715" y="449" class="class-code" text-anchor="start">+ consume(batch)</text>
<text x="715" y="468" class="class-desc" text-anchor="start">共用一批行情，按依赖执行</text>
<path d="M846 488 V554" class="edge" marker-end="url(#arrow)"/>
<text x="855" y="523" class="caption" text-anchor="start">调用算子</text>
<rect x="704" y="554" width="284" height="108" rx="7" class="uml"/>
<text x="846" y="571" class="tag" text-anchor="middle">«interface»</text>
<text x="846" y="591" class="class-head" text-anchor="middle">Calculation</text>
<line x1="704" y1="601" x2="988" y2="601" class="rule"/>
<text x="715" y="622" class="class-code" text-anchor="start">+ input_requirement()</text>
<text x="715" y="641" class="class-code" text-anchor="start">+ consume(batch, session)</text>
<path d="M846 721 V662" class="implements" marker-end="url(#triangle)"/>
<rect x="704" y="721" width="284" height="84" rx="7" class="uml"/>
<text x="846" y="747" class="class-head" text-anchor="middle">现有指标算子</text>
<line x1="704" y1="757" x2="988" y2="757" class="rule"/>
<text x="715" y="778" class="class-desc" text-anchor="start">MA · MACD · KDJ · BOLL</text>
<text x="715" y="797" class="class-desc" text-anchor="start">参数、公式、预热不改</text>
<text x="718" y="869" class="fine" text-anchor="start">跨批次状态沿用现有计算内核。</text>
<rect x="1036" y="373" width="284" height="115" rx="7" class="uml"/>
<text x="1178" y="399" class="class-head" text-anchor="middle">OutputCollector</text>
<line x1="1036" y1="409" x2="1320" y2="409" class="rule"/>
<text x="1047" y="430" class="class-code" text-anchor="start">+ append_new_rows(outputs)</text>
<text x="1047" y="449" class="class-code" text-anchor="start">+ build_result()</text>
<text x="1047" y="468" class="class-desc" text-anchor="start">核对字段、行数与时间位置</text>
<path d="M1178 488 V554" class="edge" marker-end="url(#arrow)"/>
<text x="1187" y="523" class="caption" text-anchor="start">生成</text>
<rect x="1036" y="554" width="284" height="98" rx="7" class="uml"/>
<text x="1178" y="580" class="class-head" text-anchor="middle">CalculationResult</text>
<line x1="1036" y1="590" x2="1320" y2="590" class="rule"/>
<text x="1047" y="611" class="class-desc" text-anchor="start">times · calculations</text>
<text x="1047" y="630" class="class-desc" text-anchor="start">只交付目标区间</text>
<path d="M1178 652 V721" class="edge" marker-end="url(#arrow)"/>
<rect x="1036" y="721" width="284" height="84" rx="7" class="uml"/>
<text x="1178" y="747" class="class-head" text-anchor="middle">CalculationValues</text>
<line x1="1036" y1="757" x2="1320" y2="757" class="rule"/>
<text x="1047" y="778" class="class-desc" text-anchor="start">算子 ID · 有效参数 · 字段</text>
<text x="1047" y="797" class="class-desc" text-anchor="start">不需要上游提供结果标识</text>
<text x="1050" y="869" class="fine" text-anchor="start">失败不返回空成功或部分结果。</text>
<text x="28" y="925" class="fine" text-anchor="start">实线：调用或交付    虚线空心三角：实现接口    ¹ 首版分钟线不调用此方法检查缺口；完整字段与方法见详细设计。</text>
</svg>

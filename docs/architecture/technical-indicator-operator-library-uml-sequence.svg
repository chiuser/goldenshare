<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 1084" role="img" aria-labelledby="title caption">
<title id="title">技术指标算子库 UML 请求时序图</title>
<desc id="caption">上游提交请求，库解析并沿用既有预热规则，按环境读固定来源，逐批计算，最后返回结果。无目标行情、读取错误或输入失败时，清理并报错，不访问其他来源。</desc>
<style>
  svg {font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  text {fill:#172f4b}
  .title {font-size:31px;font-weight:730}
  .subtitle,.fine {fill:#4a6179;font-size:15px}
  .section {font-size:16px;font-weight:700}
  .class-head {font-size:16px;font-weight:650}
  .class-code {font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .class-desc {font-size:14px;fill:#4a6179}
  .caption {font-size:14px;fill:#485e77}
  .chiptext {font-size:13px;font-weight:700}
  .tag {fill:#3e5773;font-size:12px;font-weight:700}
  .bg {fill:#f4f7fb;stroke:#d4e0ed}
  .top {fill:#e9f1fb;stroke:#bccfe4}
  .zone {fill:#f8fafc;stroke:#cbd8e6}
  .zonehead {fill:#eaf0f7}
  .uml {fill:#fff;stroke:#9cb2ca;stroke-width:1.3}
  .new {fill:#eaf8f3;stroke:#58a790;stroke-width:1.4}
  .entry {fill:#fff;stroke:#386cb4;stroke-width:1.8}
  .rule {stroke:#b4c6d9;stroke-width:1}
  .edge,.returns,.implements,.critical {fill:none;stroke:#456383;stroke-width:1.65}
  .returns,.implements {stroke-dasharray:6 4}
  .critical {stroke:#9f362f;stroke-width:1.9}
  .lifeline {stroke:#a8bbcf;stroke-width:1.25;stroke-dasharray:4 5}
  .calltext,.returntext,.errtext {paint-order:stroke;stroke:#fcfdff;stroke-width:8px;stroke-linejoin:round;font-size:15px}
  .returntext {fill:#4a6179}
  .errtext {fill:#90372e;font-weight:650}
  .alt-frame {fill:none;stroke:#819ab6;stroke-width:1.3}
  .alt-failure {fill:#fff3f0}
  .alt-ok {fill:#edf7f2}
  .note {fill:#fff8e9;stroke:#dfc792}
</style>
<defs>
  <marker id="arrow" orient="auto" markerUnits="userSpaceOnUse" refX="8.7" refY="5" markerWidth="12" markerHeight="10"><path d="M1 1L8 5 1 9" fill="none" stroke="#456383" stroke-width="1.55" stroke-linecap="round"/></marker>
  <marker id="error-arrow" orient="auto" markerUnits="userSpaceOnUse" refX="8.7" refY="5" markerWidth="12" markerHeight="10"><path d="M1 1L8 5 1 9" fill="none" stroke="#9f362f" stroke-width="1.7" stroke-linecap="round"/></marker>
  <marker id="triangle" orient="auto" markerUnits="userSpaceOnUse" refX="12.1" refY="6" markerWidth="13" markerHeight="12"><path d="M1 1L12 6 1 11Z" fill="#fff" stroke="#456383" stroke-width="1.45"/></marker>
</defs>
<rect x="1" y="1" width="1358" height="1082" rx="16" class="bg"/>
<text x="28" y="49" class="title" text-anchor="start">技术指标算子库 · UML 请求时序图</text>
<text x="29" y="76" class="subtitle" text-anchor="start">一次请求固定一个来源。无目标行情或读取失败，报错并清理，不访问另一端。</text>
<rect x="24" y="100" width="1312" height="936" rx="11" class="zone"/>
<rect x="32" y="117" width="154" height="55" rx="7" class="top"/>
<text x="109" y="140" class="section" text-anchor="middle">上游业务</text>
<line x1="109" y1="172" x2="109" y2="1016" class="lifeline"/>
<rect x="224" y="117" width="154" height="55" rx="7" class="top"/>
<text x="301" y="140" class="section" text-anchor="middle">库的统一入口</text>
<text x="301" y="160" class="caption" text-anchor="middle">Service</text>
<line x1="301" y1="172" x2="301" y2="1016" class="lifeline"/>
<rect x="414" y="117" width="154" height="55" rx="7" class="top"/>
<text x="491" y="140" class="section" text-anchor="middle">指令解析</text>
<text x="491" y="160" class="caption" text-anchor="middle">Parser</text>
<line x1="491" y1="172" x2="491" y2="1016" class="lifeline"/>
<rect x="603" y="117" width="154" height="55" rx="7" class="top"/>
<text x="680" y="140" class="section" text-anchor="middle">行情读取与校验</text>
<text x="680" y="160" class="caption" text-anchor="middle">PriceInputSession</text>
<line x1="680" y1="172" x2="680" y2="1016" class="lifeline"/>
<rect x="794" y="117" width="154" height="55" rx="7" class="top"/>
<text x="871" y="140" class="section" text-anchor="middle">指定的数据源</text>
<text x="871" y="160" class="caption" text-anchor="middle">DG / Prod PG</text>
<line x1="871" y1="172" x2="871" y2="1016" class="lifeline"/>
<rect x="984" y="117" width="154" height="55" rx="7" class="top"/>
<text x="1061" y="140" class="section" text-anchor="middle">算子计算</text>
<text x="1061" y="160" class="caption" text-anchor="middle">CalculationEngine</text>
<line x1="1061" y1="172" x2="1061" y2="1016" class="lifeline"/>
<rect x="1173" y="117" width="154" height="55" rx="7" class="top"/>
<text x="1250" y="140" class="section" text-anchor="middle">输出检查</text>
<text x="1250" y="160" class="caption" text-anchor="middle">OutputCollector</text>
<line x1="1250" y1="172" x2="1250" y2="1016" class="lifeline"/>
<path d="M109 204 H301" class="edge" marker-end="url(#arrow)"/>
<text x="205" y="195" class="calltext" text-anchor="middle">calculate(request)</text>
<path d="M301 246 H491" class="edge" marker-end="url(#arrow)"/>
<text x="396" y="237" class="calltext" text-anchor="middle">parse(request)</text>
<path d="M491 288 H301" class="returns" marker-end="url(#arrow)"/>
<text x="396" y="279" class="returntext" text-anchor="middle">原指令、算子计划、读取位置</text>
<path d="M301 330 H1061" class="edge" marker-end="url(#arrow)"/>
<text x="681" y="321" class="calltext" text-anchor="middle">沿用现有规则确定字段、历史窗口和预热</text>
<path d="M1061 372 H301" class="returns" marker-end="url(#arrow)"/>
<text x="681" y="363" class="returntext" text-anchor="middle">HistoryRequirement</text>
<path d="M301 414 H680" class="edge" marker-end="url(#arrow)"/>
<text x="490.5" y="405" class="calltext" text-anchor="middle">ReadRequirement</text>
<path d="M680 456 H871" class="edge" marker-end="url(#arrow)"/>
<text x="775.5" y="447" class="calltext" text-anchor="middle">定位并打开指定来源</text>
<path d="M871 498 H680" class="returns" marker-end="url(#arrow)"/>
<text x="775.5" y="489" class="returntext" text-anchor="middle">定位结果或错误</text>
<rect x="39" y="525" width="1272" height="502" rx="6" class="alt-frame"/>
<rect x="40" y="526" width="1270" height="32" rx="4" class="alt-failure"/>
<text x="53" y="547" class="chiptext" text-anchor="start">alt</text>
<text x="87" y="547" class="errtext" text-anchor="start">[无目标行情，或任何一批读取／输入检查失败]</text>
<path d="M680 592 H301" class="critical" marker-end="url(#error-arrow)"/>
<text x="490.5" y="583" class="errtext" text-anchor="middle">错误：不再读批次，丢弃本次结果</text>
<path d="M301 634 H109" class="critical" marker-end="url(#error-arrow)"/>
<text x="205" y="625" class="errtext" text-anchor="middle">清理后抛错，不降级</text>
<line x1="40" y1="654" x2="1310" y2="654" class="rule"/>
<rect x="40" y="655" width="1270" height="31" rx="4" class="alt-ok"/>
<text x="53" y="677" class="chiptext" text-anchor="start">[读取和检查通过]</text>
<rect x="231" y="695" width="1056" height="231" rx="5" class="alt-frame"/>
<text x="246" y="717" class="chiptext" text-anchor="start">loop  每一批行情：读、验、算、收集；失败走上面的报错分支</text>
<path d="M680 754 H301" class="returns" marker-end="url(#arrow)"/>
<text x="490.5" y="745" class="returntext" text-anchor="middle">PriceBatch（已检查，按需复权）</text>
<path d="M301 796 H1061" class="edge" marker-end="url(#arrow)"/>
<text x="681" y="787" class="calltext" text-anchor="middle">把同一批行情交给各指标算子</text>
<path d="M1061 838 H301" class="returns" marker-end="url(#arrow)"/>
<text x="681" y="829" class="returntext" text-anchor="middle">BatchCalculationOutputs</text>
<path d="M301 880 H1250" class="edge" marker-end="url(#arrow)"/>
<text x="775.5" y="871" class="calltext" text-anchor="middle">append_new_rows：校验并收集目标行</text>
<path d="M301 955 H1250" class="edge" marker-end="url(#arrow)"/>
<text x="775.5" y="946" class="calltext" text-anchor="middle">读取完成后 build_result：再核对完整结果</text>
<path d="M1250 988 H301" class="returns" marker-end="url(#arrow)"/>
<text x="775.5" y="979" class="returntext" text-anchor="middle">CalculationResult</text>
<path d="M301 1018 H109" class="returns" marker-end="url(#arrow)"/>
<text x="205" y="1009" class="returntext" text-anchor="middle">清理后交付</text>
<text x="28" y="1063" class="fine" text-anchor="start">分钟线按实际读到的 K 线计算；整个目标区间无行情：报「读取数据失败」，detail 为「数据缺失」。</text>
</svg>

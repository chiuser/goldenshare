[project]
name = "orchestrator"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.26",
    "dagster-clickhouse==0.29.26",
    "dagster-postgres==0.29.26",
    "duckdb>=1.5.2",
    "goldenshare-technical-indicators==0.1.0; python_version >= '3.13'",
    "psycopg2-binary>=2.9.12",
    "tushare>=1.4.20",
]

[dependency-groups]
dev = [
    "dagster-dg-cli==1.13.26",
    "dagster-webserver==1.13.26",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.uv.sources]
goldenshare-technical-indicators = { path = "../../packages/technical_indicators" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"pyproject.toml" = "pyproject.toml"
"src/orchestrator/seeds/market/major_indices.cn_a.csv" = "src/orchestrator/seeds/market/major_indices.cn_a.csv"
"src/orchestrator/seeds/quote/stk_mins_price_corrections.cn_a.csv" = "src/orchestrator/seeds/quote/stk_mins_price_corrections.cn_a.csv"

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "orchestrator"
registry_modules = [
    "orchestrator.components.*",
]

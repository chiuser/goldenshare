[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goldenshare-technical-indicators"
version = "0.1.0"
description = "Goldenshare technical indicator and quantitative structure calculations"
requires-python = ">=3.13"

[project.optional-dependencies]
sql = ["duckdb>=1.3,<2", "pyarrow==23.0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"goldenshare_technical_indicators.calculation" = ["sql/*.sql"]
"goldenshare_technical_indicators.sources" = ["sql/*.sql"]
"goldenshare_technical_indicators.output" = ["sql/*.sql"]
